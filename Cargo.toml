[package]
name = "matsya"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
description = "Lock files and SBOMs for OS package managers: apt, dnf/yum/zypper (rpm), apk, pacman and Homebrew"
license = "Apache-2.0"
repository = "https://github.com/dmdhrumilmistry/matsya"
readme = "README.md"
keywords = ["lockfile", "sbom", "cyclonedx", "spdx", "reproducibility"]
categories = ["command-line-utilities", "development-tools"]
homepage = "https://github.com/dmdhrumilmistry/matsya"
include = [
  "src/**/*.rs",
  "tests/fixtures/**",
  "examples/debian-12.lock.json",
  "examples/multi-machine.lock.json",
  "docs/*.md",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE",
]

[dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2.191"
lz4_flex = "0.14.0"
lzma-rs = "0.3.0"
ruzstd = "0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
toml = "1.1.8"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
uuid = { version = "1", features = ["v5"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
