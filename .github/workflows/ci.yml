name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # weekly, so new advisories are caught without a push

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  audit:
    name: security audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get install -y -q musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: file target/${{ matrix.target }}/release/matsya && ls -la target/${{ matrix.target }}/release/matsya
      - uses: actions/upload-artifact@v7
        with:
          name: matsya-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/matsya

  sbom-schema:
    name: SBOM schema validation
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: matsya-x86_64-unknown-linux-musl
          path: bin
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "cyclonedx-python-lib[json-validation]" spdx-tools
      - run: |
          chmod +x bin/matsya
          sudo apt-get update -q
          bin/matsya lock -f runner.lock.json
          for f in examples/multi-machine.lock.json runner.lock.json; do
            mkdir -p "sbom/$(basename "$f" .lock.json)"
            bin/matsya sbom -f "$f" --env all -o "sbom/$(basename "$f" .lock.json)"
            bin/matsya sbom -f "$f" --env all --format spdx -o "sbom/$(basename "$f" .lock.json)"
          done
          for cdx in sbom/*/*.cdx.json; do python ci/validate_sbom.py "$cdx" "${cdx%.cdx.json}.spdx.json"; done

  distro:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
        image:
          - debian:12
          - debian:trixie
          - ubuntu:22.04
          - ubuntu:24.04
          - fedora:latest
          - rockylinux/rockylinux:9
          - rockylinux/rockylinux:8
          - amazonlinux:2
          - opensuse/tumbleweed
          - alpine:latest
          - archlinux:latest
        include:
          - { arch: aarch64, image: "debian:12" }
          - { arch: aarch64, image: "fedora:latest" }
          - { arch: aarch64, image: "alpine:latest" }
    steps:
      - uses: actions/checkout@v7
      - id: name
        run: echo "name=$(echo '${{ matrix.image }}-${{ matrix.arch }}' | tr ':/' '--')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: matsya-${{ matrix.arch }}-unknown-linux-musl
          path: bin
      - run: chmod +x bin/matsya && mkdir -p out
      - name: No external tools during lock/check/sbom (empty PATH)
        run: |
          docker run --rm -v "$PWD:/src" ${{ matrix.image }} sh -c '
            env -i PATH=/nonexistent /src/bin/matsya lock -f /tmp/l.json &&
            env -i PATH=/nonexistent /src/bin/matsya check -f /tmp/l.json &&
            env -i PATH=/nonexistent /src/bin/matsya sbom -f /tmp/l.json -o /tmp/s.json'
      - name: Capture, drift, repair
        run: docker run --rm -v "$PWD:/src" ${{ matrix.image }} sh /src/ci/inside.sh capture /src/out/env.lock.json
      - name: Restore on a fresh container
        run: docker run --rm -v "$PWD:/src" ${{ matrix.image }} sh /src/ci/inside.sh restore /src/out/env.lock.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lock-${{ steps.name.outputs.name }}
          path: out/

  homebrew:
    name: homebrew (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'macOS'
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --locked && mkdir -p bin && cp target/release/matsya bin/
      - uses: actions/download-artifact@v8
        if: runner.os == 'Linux'
        with:
          name: matsya-x86_64-unknown-linux-musl
          path: bin
      - name: Set up Homebrew on Linux
        if: runner.os == 'Linux'
        run: |
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"
      - name: Lock, drift, repair
        run: |
          set -x
          chmod +x bin/matsya
          M=bin/matsya
          brew install tree
          $M lock -m brew -f brew.lock.json
          $M check -m brew -f brew.lock.json
          $M sbom -f brew.lock.json -o brew.cdx.json
          $M export --format brewfile -f brew.lock.json
          brew uninstall tree
          if $M check -m brew -f brew.lock.json; then echo "drift not detected"; exit 1; fi
          $M apply -m brew -f brew.lock.json --dry-run --no-refresh
          $M apply -m brew -f brew.lock.json --yes --no-refresh
          $M check -m brew -f brew.lock.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: brew-${{ matrix.os }}
          path: brew.*
