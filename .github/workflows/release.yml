name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest, asset: matsya-x86_64-linux }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, asset: matsya-aarch64-linux }
          - { target: aarch64-apple-darwin, runner: macos-latest, asset: matsya-aarch64-macos }
          - { target: x86_64-apple-darwin, runner: macos-latest, asset: matsya-x86_64-macos }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/matsya dist/${{ matrix.asset }}
          cd dist && shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && cat *.sha256 > SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --generate-notes --title "${GITHUB_REF_NAME}" ./*
