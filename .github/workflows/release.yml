name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest, asset: matsya-x86_64-linux }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, asset: matsya-aarch64-linux }
          - { target: aarch64-apple-darwin, runner: macos-latest, asset: matsya-aarch64-macos }
          - { target: x86_64-apple-darwin, runner: macos-latest, asset: matsya-x86_64-macos }
          - { target: aarch64-linux-android, runner: ubuntu-latest, asset: matsya-aarch64-android }
          - { target: x86_64-linux-android, runner: ubuntu-latest, asset: matsya-x86_64-android }
          - { target: armv7-linux-androideabi, runner: ubuntu-latest, asset: matsya-armv7-android }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get install -y -q musl-tools
      - if: contains(matrix.target, 'android')
        name: Use the Android NDK as linker and C compiler
        run: sh ci/android-env.sh ${{ matrix.target }} >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/matsya dist/${{ matrix.asset }}
          cd dist && shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && cat *.sha256 > SHA256SUMS
          # A release for this tag may already exist (created by hand from
          # the GitHub UI); add the binaries to it instead of failing.
          if gh release view "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --clobber ./*
          else
            gh release create "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --generate-notes --title "${GITHUB_REF_NAME}" ./*
          fi

  crate:
    name: publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag must match Cargo.toml version
        run: |
          want="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml $want"; exit 1; }
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
