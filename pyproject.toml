[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "syslock"
dynamic = ["version"]
description = "Lock files and SBOMs for OS package managers: apt, dnf/yum/zypper (rpm), apk, pacman and Homebrew"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Dhrumil Mistry" }]
keywords = ["lockfile", "sbom", "cyclonedx", "spdx", "apt", "dnf", "apk", "pacman", "homebrew", "reproducibility", "supply-chain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Software Distribution",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dmdhrumilmistry/syslock"
Issues = "https://github.com/dmdhrumilmistry/syslock/issues"

[project.scripts]
syslock = "syslock.cli:main"

[tool.setuptools.dynamic]
version = { attr = "syslock.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
